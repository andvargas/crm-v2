<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Studio CRM — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fb;color:#0f172a;font:15px/1.5 system-ui,-apple-system,sans-serif}.card{width:min(100%,440px);padding:36px;border:1px solid #e2e8f0;border-radius:24px;background:#fff;box-shadow:0 20px 50px #cbd5e166}.mark{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;background:#4f46e5;color:#fff;font-weight:800}.eyebrow{margin:24px 0 4px;color:#4f46e5;font-size:13px;font-weight:700}.title{margin:0;font-size:28px;line-height:1.2}.copy{margin:12px 0 24px;color:#64748b}.button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;border:0;border-radius:12px;padding:0 18px;background:#4f46e5;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">SC</div><p class="eyebrow">Studio CRM</p><h1 class="title">You’re offline</h1><p class="copy">Reconnect to access your secure CRM workspace. Organization records are intentionally not stored for offline access.</p><button class="button" onclick="location.reload()">Try again</button></main></body>
</html>
